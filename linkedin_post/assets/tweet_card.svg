<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080810"/>
      <stop offset="100%" style="stop-color:#100818"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF8C42;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#FF8C42;stop-opacity:0.8"/>
      <stop offset="70%" style="stop-color:#FF8C42;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#FF8C42;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Subtle ambient light — top left -->
  <ellipse cx="100" cy="80" rx="300" ry="200" fill="#FF8C42" opacity="0.04" filter="url(#soft)"/>
  <!-- bottom right -->
  <ellipse cx="1100" cy="600" rx="300" ry="200" fill="#7B61FF" opacity="0.05" filter="url(#soft)"/>

  <!-- Thin horizontal rule top -->
  <rect x="60" y="58" width="1080" height="1" fill="url(#lineGlow)" opacity="0.4"/>

  <!-- Top label -->
  <text x="60" y="46" font-family="'Courier New', monospace" font-size="12" fill="#FF8C42" opacity="0.5" letter-spacing="3">RETOUR D'EXPERIENCE — CLAUDE API</text>
  <text x="1140" y="46" font-family="'Courier New', monospace" font-size="12" fill="#555" text-anchor="end">2025</text>

  <!-- Main quote — big and centered -->
  <text x="600" y="185" font-family="Georgia, serif" font-size="20" fill="#888" text-anchor="middle" font-style="italic">« Ce n'est pas l'IA qui est puissante.</text>
  <text x="600" y="220" font-family="Georgia, serif" font-size="20" fill="#888" text-anchor="middle" font-style="italic">C'est la façon dont on la structure. »</text>

  <!-- Orange accent line under quote -->
  <rect x="540" y="238" width="120" height="2" fill="#FF8C42" opacity="0.6"/>

  <!-- 4 observations — left aligned, like a journal -->
  <!-- Observation 1 -->
  <text x="60" y="310" font-family="'Courier New', monospace" font-size="13" fill="#FF8C42" opacity="0.7">01 /</text>
  <text x="110" y="310" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="white">Cache</text>
  <text x="185" y="310" font-family="Arial, sans-serif" font-size="15" fill="#888">— Je répétais le même contexte à chaque appel.</text>
  <text x="110" y="332" font-family="Arial, sans-serif" font-size="15" fill="#666">Maintenant Claude s'en souvient. Je passe à l'essentiel.</text>

  <!-- Observation 2 -->
  <text x="60" y="385" font-family="'Courier New', monospace" font-size="13" fill="#7B61FF" opacity="0.8">02 /</text>
  <text x="110" y="385" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="white">Streaming</text>
  <text x="225" y="385" font-family="Arial, sans-serif" font-size="15" fill="#888">— La latence perçue disparaît.</text>
  <text x="110" y="407" font-family="Arial, sans-serif" font-size="15" fill="#666">C'est ce détail qui décide si un outil est adopté ou abandonné.</text>

  <!-- Observation 3 -->
  <text x="60" y="460" font-family="'Courier New', monospace" font-size="13" fill="#00C2A8" opacity="0.8">03 /</text>
  <text x="110" y="460" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="white">Tool use</text>
  <text x="213" y="460" font-family="Arial, sans-serif" font-size="15" fill="#888">— Claude a cessé de répondre. Il agit.</text>
  <text x="110" y="482" font-family="Arial, sans-serif" font-size="15" fill="#666">La différence n'est pas technique — elle est conceptuelle.</text>

  <!-- Observation 4 -->
  <text x="60" y="535" font-family="'Courier New', monospace" font-size="13" fill="#FF5FA0" opacity="0.8">04 /</text>
  <text x="110" y="535" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="white">Batch</text>
  <text x="175" y="535" font-family="Arial, sans-serif" font-size="15" fill="#888">— 1 000 éléments traités comme s'il n'y en avait qu'un.</text>
  <text x="110" y="557" font-family="Arial, sans-serif" font-size="15" fill="#666">Je soumets, je reviens quand c'est prêt.</text>

  <!-- Vertical separator line left -->
  <rect x="88" y="295" width="1" height="282" fill="#333"/>

  <!-- Right side — code snippet -->
  <rect x="720" y="290" width="440" height="285" rx="12" fill="#0D0D18" stroke="#222" stroke-width="1"/>
  <!-- window dots -->
  <circle cx="746" cy="314" r="5" fill="#FF5F57" opacity="0.7"/>
  <circle cx="764" cy="314" r="5" fill="#FFBD2E" opacity="0.7"/>
  <circle cx="782" cy="314" r="5" fill="#28CA41" opacity="0.7"/>

  <!-- code lines -->
  <text x="746" y="348" font-family="'Courier New', monospace" font-size="12" fill="#555">import anthropic</text>
  <text x="746" y="370" font-family="'Courier New', monospace" font-size="12" fill="#555">client = anthropic.</text>
  <text x="892" y="370" font-family="'Courier New', monospace" font-size="12" fill="#7B8CBA">Anthropic()</text>

  <text x="746" y="400" font-family="'Courier New', monospace" font-size="12" fill="#444">system=[{</text>
  <text x="762" y="420" font-family="'Courier New', monospace" font-size="12" fill="#555">"type": </text>
  <text x="820" y="420" font-family="'Courier New', monospace" font-size="12" fill="#5A8C5A">"text"</text>
  <text x="857" y="420" font-family="'Courier New', monospace" font-size="12" fill="#444">,</text>
  <text x="762" y="440" font-family="'Courier New', monospace" font-size="12" fill="#555">"text": </text>
  <text x="818" y="440" font-family="'Courier New', monospace" font-size="12" fill="#7B8CBA">mon_contexte</text>
  <text x="762" y="460" font-family="'Courier New', monospace" font-size="12" fill="#FF8C42">"cache_control"</text>
  <text x="886" y="460" font-family="'Courier New', monospace" font-size="12" fill="#555">: {</text>
  <text x="778" y="480" font-family="'Courier New', monospace" font-size="12" fill="#555">"type": </text>
  <text x="836" y="480" font-family="'Courier New', monospace" font-size="12" fill="#5A8C5A">"ephemeral"</text>
  <text x="762" y="500" font-family="'Courier New', monospace" font-size="12" fill="#555">}}]</text>

  <!-- cursor -->
  <rect x="746" y="516" width="7" height="13" fill="#FF8C42" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0;0.7" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Arrow pointing to cache_control -->
  <line x1="714" y1="460" x2="756" y2="460" stroke="#FF8C42" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
  <text x="710" y="464" font-family="'Courier New', monospace" font-size="10" fill="#FF8C42" opacity="0.6" text-anchor="end">la ligne clé</text>

  <!-- Bottom rule -->
  <rect x="60" y="618" width="1080" height="1" fill="url(#lineGlow)" opacity="0.3"/>

  <!-- Footer -->
  <text x="60" y="643" font-family="'Courier New', monospace" font-size="11" fill="#444">github.com/charly4perrin-jpg/simplinvest</text>
  <text x="1140" y="643" font-family="'Courier New', monospace" font-size="11" fill="#444" text-anchor="end">#PromptEngineering  #Claude  #AI</text>
</svg>
