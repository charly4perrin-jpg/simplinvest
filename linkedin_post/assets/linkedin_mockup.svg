  <!-- ── COMMENT BOX ── -->
  <rect x="0" y="1804" width="680" height="1" fill="#E0DFDC"/>
  <circle cx="30" cy="1832" r="18" fill="url(#avatarGrad)"/>
  <text x="30" y="1838" font-family="Arial" font-size="14" font-weight="900" fill="white" text-anchor="middle">C</text>
  <rect x="58" y="1816" width="590" height="32" rx="16" fill="white" stroke="#E0DFDC" stroke-width="1"/>
