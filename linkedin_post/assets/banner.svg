<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A1A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0D1B2A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A0A2E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CC785C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8A87C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="codeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#CC785C;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#CC785C;stop-opacity:0.03" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient glow blobs -->
  <circle cx="200" cy="150" r="200" fill="#CC785C" opacity="0.06" filter="url(#blur)" />
  <circle cx="900" cy="480" r="250" fill="#7B61FF" opacity="0.06" filter="url(#blur)" />
  <circle cx="1100" cy="100" r="150" fill="#CC785C" opacity="0.04" filter="url(#blur)" />

  <!-- Grid lines -->
  <g opacity="0.04" stroke="#CC785C" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Code block background -->
  <rect x="580" y="60" width="580" height="510" rx="16" fill="url(#codeGlow)" />
  <rect x="580" y="60" width="580" height="510" rx="16" fill="none" stroke="#CC785C" stroke-opacity="0.12" stroke-width="1" />

  <!-- Code block header dots -->
  <circle cx="610" cy="90" r="7" fill="#FF5F57" opacity="0.8" />
  <circle cx="632" cy="90" r="7" fill="#FFBD2E" opacity="0.8" />
  <circle cx="654" cy="90" r="7" fill="#28CA41" opacity="0.8" />

  <!-- Code content -->
  <text x="610" y="130" font-family="'Courier New', monospace" font-size="13" fill="#CC785C" opacity="0.6">import anthropic</text>
  <text x="610" y="155" font-family="'Courier New', monospace" font-size="13" fill="#6B8CBA">client = </text>
  <text x="677" y="155" font-family="'Courier New', monospace" font-size="13" fill="#E8A87C">anthropic</text>
  <text x="753" y="155" font-family="'Courier New', monospace" font-size="13" fill="#A8B8D0">.</text>
  <text x="761" y="155" font-family="'Courier New', monospace" font-size="13" fill="#E8A87C">Anthropic</text>
  <text x="833" y="155" font-family="'Courier New', monospace" font-size="13" fill="#A8B8D0">()</text>

  <text x="610" y="195" font-family="'Courier New', monospace" font-size="13" fill="#7B61FF">response</text>
  <text x="670" y="195" font-family="'Courier New', monospace" font-size="13" fill="#A8B8D0"> = client.</text>
  <text x="731" y="195" font-family="'Courier New', monospace" font-size="13" fill="#E8A87C">messages</text>
  <text x="797" y="195" font-family="'Courier New', monospace" font-size="13" fill="#A8B8D0">.</text>
  <text x="805" y="195" font-family="'Courier New', monospace" font-size="13" fill="#6B8CBA">create</text>
  <text x="847" y="195" font-family="'Courier New', monospace" font-size="13" fill="#A8B8D0">(</text>

  <text x="630" y="220" font-family="'Courier New', monospace" font-size="13" fill="#A8B8D0">model=</text>
  <text x="674" y="220" font-family="'Courier New', monospace" font-size="13" fill="#28CA41">"claude-sonnet-4-6"</text>
  <text x="820" y="220" font-family="'Courier New', monospace" font-size="13" fill="#A8B8D0">,</text>

  <text x="630" y="245" font-family="'Courier New', monospace" font-size="13" fill="#A8B8D0">max_tokens=</text>
  <text x="710" y="245" font-family="'Courier New', monospace" font-size="13" fill="#FF9F7E">2048</text>
  <text x="732" y="245" font-family="'Courier New', monospace" font-size="13" fill="#A8B8D0">,</text>

  <text x="630" y="270" font-family="'Courier New', monospace" font-size="13" fill="#A8B8D0">system=[{</text>

  <text x="650" y="295" font-family="'Courier New', monospace" font-size="13" fill="#A8B8D0">"type":</text>
  <text x="698" y="295" font-family="'Courier New', monospace" font-size="13" fill="#28CA41">"text"</text>
  <text x="729" y="295" font-family="'Courier New', monospace" font-size="13" fill="#A8B8D0">,</text>

  <text x="650" y="320" font-family="'Courier New', monospace" font-size="13" fill="#A8B8D0">"text":</text>
  <text x="698" y="320" font-family="'Courier New', monospace" font-size="13" fill="#28CA41">"Expert assistant"</text>
  <text x="828" y="320" font-family="'Courier New', monospace" font-size="13" fill="#A8B8D0">,</text>

  <text x="650" y="345" font-family="'Courier New', monospace" font-size="13" fill="#CC785C">"cache_control"</text>
  <text x="757" y="345" font-family="'Courier New', monospace" font-size="13" fill="#A8B8D0">:</text>
  <text x="765" y="345" font-family="'Courier New', monospace" font-size="13" fill="#A8B8D0">{</text>

  <text x="670" y="370" font-family="'Courier New', monospace" font-size="13" fill="#A8B8D0">"type":</text>
  <text x="718" y="370" font-family="'Courier New', monospace" font-size="13" fill="#28CA41">"ephemeral"</text>

  <text x="650" y="395" font-family="'Courier New', monospace" font-size="13" fill="#A8B8D0">}}],</text>

  <text x="630" y="430" font-family="'Courier New', monospace" font-size="13" fill="#A8B8D0">messages=[{</text>
  <text x="650" y="455" font-family="'Courier New', monospace" font-size="13" fill="#A8B8D0">"role":</text>
  <text x="698" y="455" font-family="'Courier New', monospace" font-size="13" fill="#28CA41">"user"</text>
  <text x="729" y="455" font-family="'Courier New', monospace" font-size="13" fill="#A8B8D0">,</text>
  <text x="650" y="480" font-family="'Courier New', monospace" font-size="13" fill="#A8B8D0">"content":</text>
  <text x="722" y="480" font-family="'Courier New', monospace" font-size="13" fill="#7B61FF">prompt</text>
  <text x="610" y="505" font-family="'Courier New', monospace" font-size="13" fill="#A8B8D0">}])</text>

  <!-- Cursor blink -->
  <rect x="642" y="516" width="8" height="16" fill="#CC785C" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite" />
  </rect>

  <!-- Left side: Main content -->
  <!-- Anthropic logo-like icon -->
  <g transform="translate(60, 60)">
    <polygon points="40,0 80,70 0,70" fill="none" stroke="url(#glow)" stroke-width="3" opacity="0.9" />
    <polygon points="40,15 68,63 12,63" fill="#CC785C" opacity="0.15" />
    <text x="40" y="48" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#CC785C" text-anchor="middle">A</text>
  </g>

  <!-- CLAUDE label -->
  <text x="160" y="95" font-family="Arial, sans-serif" font-size="22" font-weight="bold" letter-spacing="8" fill="#CC785C" opacity="0.9">CLAUDE</text>

  <!-- Main headline -->
  <text x="60" y="190" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="white">🚀 Maîtrisez</text>
  <text x="60" y="252" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="url(#glow)">Claude API</text>
  <text x="60" y="314" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="white">en 5 min</text>

  <!-- Subtitle -->
  <text x="60" y="365" font-family="Arial, sans-serif" font-size="20" fill="#A8B8D0" opacity="0.85">Code prêt à l'emploi · Prompt Caching · Streaming</text>

  <!-- Feature badges -->
  <rect x="60" y="395" width="160" height="36" rx="18" fill="#CC785C" fill-opacity="0.15" stroke="#CC785C" stroke-opacity="0.4" stroke-width="1" />
  <text x="140" y="418" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#E8A87C" text-anchor="middle">⚡ Performance</text>

  <rect x="232" y="395" width="140" height="36" rx="18" fill="#7B61FF" fill-opacity="0.15" stroke="#7B61FF" stroke-opacity="0.4" stroke-width="1" />
  <text x="302" y="418" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#A99FFF" text-anchor="middle">🔧 Pratique</text>

  <rect x="384" y="395" width="140" height="36" rx="18" fill="#28CA41" fill-opacity="0.1" stroke="#28CA41" stroke-opacity="0.3" stroke-width="1" />
  <text x="454" y="418" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#5EE876" text-anchor="middle">💰 Économique</text>

  <!-- Divider line -->
  <line x1="60" y1="460" x2="520" y2="460" stroke="#CC785C" stroke-opacity="0.2" stroke-width="1" />

  <!-- Stats -->
  <text x="80" y="500" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#CC785C">90%</text>
  <text x="80" y="525" font-family="Arial, sans-serif" font-size="13" fill="#A8B8D0">réduction coûts</text>
  <text x="80" y="542" font-family="Arial, sans-serif" font-size="13" fill="#A8B8D0">avec le cache</text>

  <line x1="230" y1="475" x2="230" y2="550" stroke="#CC785C" stroke-opacity="0.15" stroke-width="1" />

  <text x="260" y="500" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#7B61FF">5x</text>
  <text x="260" y="525" font-family="Arial, sans-serif" font-size="13" fill="#A8B8D0">plus rapide</text>
  <text x="260" y="542" font-family="Arial, sans-serif" font-size="13" fill="#A8B8D0">avec streaming</text>

  <line x1="380" y1="475" x2="380" y2="550" stroke="#CC785C" stroke-opacity="0.15" stroke-width="1" />

  <text x="410" y="500" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#28CA41">∞</text>
  <text x="410" y="525" font-family="Arial, sans-serif" font-size="13" fill="#A8B8D0">possibilités</text>
  <text x="410" y="542" font-family="Arial, sans-serif" font-size="13" fill="#A8B8D0">avec les outils</text>

  <!-- Bottom bar -->
  <rect x="0" y="595" width="1200" height="35" fill="#CC785C" fill-opacity="0.06" />
  <text x="60" y="617" font-family="Arial, sans-serif" font-size="13" fill="#CC785C" opacity="0.7">github.com/charly4perrin-jpg/simplinvest</text>
  <text x="1140" y="617" font-family="Arial, sans-serif" font-size="13" fill="#A8B8D0" opacity="0.5" text-anchor="end">#Claude #AI #Dev #Anthropic</text>
</svg>
